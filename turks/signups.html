<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- pwa-head -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0F6E8C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Thanks & Caicos">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Thanks &amp; Caicos — Tennis &amp; Massages</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css?v=19">
</head>
<body>
<main>
<header class="page-head "><div class="wrap"><div class="eyebrow">Who is booked, and when</div><h1>Tennis &amp; Massages</h1></div></header>
<div class="tabs tabs2" id="tabs">
  <button class="tab" data-t="tennis">🎾 Tennis</button>
  <button class="tab" data-t="massage">💆‍♀️ Massages</button>
</div>

<div class="panel" id="p-tennis" hidden>
  <figure class="photo"><img src="images/tennis.jpg" alt="The tennis court above the water" style="object-position:center 70%" loading="lazy"><figcaption>The tennis court at Emara East</figcaption></figure>
  <section class="band band-white"><div class="wrap narrow">
    <h2 class="sec-title">Tennis with Reinaldo</h2>
    <div class="rule"></div>
    <div id="tennis"><p class="loading">Loading…</p></div>
  </div></section>
</div>

<div class="panel" id="p-massage" hidden>
  <section class="band band-peach"><div class="wrap narrow">
    <h2 class="sec-title">Massages with Thai Bliss</h2>
    <div class="rule"></div>
    <p class="lede">At the villa.</p>
    <div class="note">Massages are $170 each for 60 minutes. Please pay your therapist in cash.</div>
    <div id="massage"><p class="loading">Loading…</p></div>
  </div></section>
</div>
</main>
<script type="module">
import { start, db, esc, dayLabel, islandToday, FOOTER } from './js/app.js?v=19';
document.querySelector('main').insertAdjacentHTML('afterend', FOOTER);
const ctx = await start('signups.html');
if (ctx) {
const $ = id => document.getElementById(id);
const whoHtml = w => String(w).split(' & ').map(n => `<span class="nm">${esc(n)}</span>`).join(' &amp; ');
const fmt = t => { const [h, m] = t.split(':').map(Number); return `${h % 12 || 12}:${String(m).padStart(2, '0')}${h < 12 ? 'am' : 'pm'}`; };
const today = islandToday();

function render(kind, rows) {
  const list = rows.filter(r => r.kind === kind);
  if (!list.length) return '<p class="muted">Nothing booked yet.</p>';
  const days = [...new Set(list.map(r => r.day))];
  return days.map(d => `<div class="day${d === today ? ' today' : ''}">
    <h3>${esc(dayLabel(d))}${d === today ? ' <span class="kind">Today</span>' : ''}</h3>
    ${list.filter(r => r.day === d).map(r => `<div class="slot"><div class="slot-time">${fmt(r.start_time)}</div>
      <div class="slot-who">${whoHtml(r.who)}${r.detail ? `<span class="slot-note">${esc(r.detail)}</span>` : ''}</div></div>`).join('')}
  </div>`).join('');
}

function show(t) {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  document.querySelectorAll('.panel').forEach(p => p.hidden = p.id !== 'p-' + t);
  history.replaceState(null, '', t === 'massage' ? '#massages' : location.pathname);
}
$('tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) show(b.dataset.t); });
show(location.hash === '#massages' ? 'massage' : 'tennis');

const { data, error } = await db.from('turks_bookings').select('*').order('day').order('start_time');
const fail = '<p class="err">Could not load the schedule. Please try again.</p>';
$('tennis').innerHTML = error ? fail : render('tennis', data || []);
$('massage').innerHTML = error ? fail : render('massage', data || []);
}
</script>
</body>
</html>
