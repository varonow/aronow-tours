<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sign In · Aronow Tours</title>
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0D1F33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aronow Tours">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Josefin+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--ink:#0D1F33;--gold:#C9A84C;--gold-soft:#e4cf94;--cream:#F7F3EA;--mist:#c9d3dd;--muted:#8ea0b2}
  html,body{height:100%}
  body{
    font-family:'Cormorant Garamond',Georgia,serif;
    background:radial-gradient(1200px 700px at 50% -10%, #17324e 0%, rgba(23,50,78,0) 60%),linear-gradient(160deg,#0a1826 0%,#0D1F33 45%,#0a1420 100%);
    color:var(--cream);min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .wrap{width:100%;max-width:440px;text-align:center}
  .crest{width:76px;height:76px;margin:0 auto 22px;display:block}
  .eyebrow{font-family:'Josefin Sans',sans-serif;font-weight:300;font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
  h1{font-family:'Playfair Display',serif;font-weight:400;font-size:2.7rem;line-height:1.05;letter-spacing:.01em;margin-bottom:8px}
  .sub{font-style:italic;font-size:1.18rem;color:var(--mist);margin-bottom:34px}
  .rule{width:44px;height:1px;background:var(--gold);margin:0 auto 34px;opacity:.8}
  .card{background:rgba(255,255,255,.035);border:1px solid rgba(201,168,76,.28);border-radius:14px;padding:34px 30px 30px;backdrop-filter:blur(6px);text-align:left}
  input{width:100%;padding:15px 16px;font-family:'Cormorant Garamond',serif;font-size:1.3rem;color:var(--cream);background:rgba(8,18,29,.6);border:1px solid rgba(201,168,76,.35);border-radius:9px;outline:none;transition:border-color .2s,box-shadow .2s}
  input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.14)}
  input::placeholder{color:#5f7488}
  input.code{text-align:center;font-family:'Playfair Display',serif;font-size:1.7rem;letter-spacing:.32em;padding-left:.32em}
  button.primary{width:100%;margin-top:20px;padding:15px 18px;cursor:pointer;font-family:'Playfair Display',serif;font-size:1.12rem;letter-spacing:.04em;color:#0D1F33;background:linear-gradient(180deg,var(--gold-soft),var(--gold));border:none;border-radius:9px;transition:transform .1s,filter .2s}
  button.primary:hover{filter:brightness(1.05);transform:translateY(-1px)}
  button.primary:disabled{opacity:.5;cursor:default;transform:none}
  label{font-family:'Josefin Sans',sans-serif;font-size:13px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--mist);display:block;margin-bottom:9px}
  .pwrow{display:flex;gap:8px}
  .pwrow input{flex:1;min-width:0}
  .showbtn{flex:0 0 auto;padding:0 16px;font-family:'Josefin Sans',sans-serif;font-size:14px;letter-spacing:.06em;color:var(--cream);background:rgba(8,18,29,.6);border:1px solid rgba(201,168,76,.35);border-radius:9px;cursor:pointer}
  .note{font-family:'Josefin Sans',sans-serif;font-size:15px;letter-spacing:.02em;line-height:1.6;color:var(--mist);margin-top:18px;text-align:center}
  .msg{margin-top:16px;padding:13px 15px;border-radius:9px;display:none;font-family:'Josefin Sans',sans-serif;font-size:15px;letter-spacing:.02em;line-height:1.5}
  .msg.error{display:block;background:rgba(140,40,40,.18);border:1px solid rgba(200,90,90,.4);color:#f0c9c9}
  .step{display:none}
  .step.show{display:block}
  .sentto{color:var(--gold-soft);font-style:italic}
  .linkbtn{background:none;border:none;color:var(--gold);cursor:pointer;font-family:'Josefin Sans',sans-serif;font-size:12px;letter-spacing:.05em;text-decoration:underline;padding:0;width:auto;margin-top:16px;display:inline-block}
  .row{display:flex;gap:18px;justify-content:center;margin-top:6px}
  .foot{margin-top:26px;font-family:'Josefin Sans',sans-serif;font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:#5f7488}
</style>
</head>
<body>
  <div class="wrap">
    <svg class="crest" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="45" fill="none" stroke="#C9A84C" stroke-width="1.6"/>
      <polygon points="50,18 58,50 50,82 42,50" fill="#C9A84C"/>
      <polygon points="18,50 50,42 82,50 50,58" fill="#C9A84C" opacity="0.85"/>
    </svg>
    <div class="eyebrow">Aronow Tours</div>
    <h1>Welcome</h1>
    <p class="sub">Every journey, in one place</p>
    <div class="rule"></div>

    <div class="card">
      <form id="signin" novalidate>
        <label for="email">Your Email</label>
        <input type="email" id="email" placeholder="you@email.com" autocomplete="username" inputmode="email" autocapitalize="none" required>
        <label for="password" style="margin-top:20px">Family Password</label>
        <div class="pwrow">
          <input type="password" id="password" placeholder="Family password" autocomplete="current-password" autocapitalize="none" required>
          <button type="button" class="showbtn" id="showpw" aria-label="Show password">Show</button>
        </div>
        <button type="submit" class="primary" id="btn">Sign In</button>
        <div class="msg" id="msg"></div>
        <p class="note">Use the email address Victoria has for you, and the family password she sent you. Capital letters don’t matter.</p>
      </form>
    </div>

    <div class="foot">By Invitation</div>
  </div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  import { SUPABASE_URL, SUPABASE_KEY } from './js/config.js';
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);
  const ROOT = new URL('./', import.meta.url).href;

  const params = new URLSearchParams(location.search);
  const next = (params.get('next') || '').replace(/^\/+/, '');
  const form = document.getElementById('signin');
  const emailInput = document.getElementById('email');
  const pwInput = document.getElementById('password');
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');

  let redirected = false;
  function go(){ if(redirected) return; redirected = true; window.location.replace(ROOT + (next || 'index.html')); }
  function err(t){ msg.className='msg error'; msg.textContent=t; }

  // Already signed in on this device? Go straight in.
  (async () => { const { data:{ session } } = await db.auth.getSession(); if (session) go(); })();

  try { const saved = localStorage.getItem('aronow_email'); if (saved) emailInput.value = saved; } catch(e) {}

  document.getElementById('showpw').addEventListener('click', (e) => {
    const show = pwInput.type === 'password';
    pwInput.type = show ? 'text' : 'password';
    e.currentTarget.textContent = show ? 'Hide' : 'Show';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault(); msg.className='msg';
    const email = emailInput.value.trim().toLowerCase();
    const password = pwInput.value.trim();
    if(!email || !email.includes('@')){ err('Please enter your email address.'); return; }
    if(!password){ err('Please enter the family password.'); return; }
    btn.disabled = true; btn.textContent = 'Signing in\u2026';
    try {
      const res = await fetch(SUPABASE_URL + '/functions/v1/family-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY },
        body: JSON.stringify({ email, password })
      });
      const out = await res.json().catch(() => ({}));
      if (!res.ok) {
        if (out.error === 'wrong_password') throw new Error('That is not the family password. Please check it and try again.');
        if (out.error === 'not_on_list') throw new Error('That email is not on the guest list. Try the address Victoria uses for you, or ask her to add this one.');
        throw new Error('Something went wrong. Please try again in a moment.');
      }
      let r = await db.auth.verifyOtp({ token_hash: out.token_hash, type: out.type || 'magiclink' });
      if (r.error) r = await db.auth.verifyOtp({ token_hash: out.token_hash, type: 'email' });
      if (r.error) throw new Error('Something went wrong. Please try again in a moment.');
      try { localStorage.setItem('aronow_email', email); } catch(e2) {}
      go();
    } catch (e2) {
      err((e2 && e2.message) || 'Something went wrong. Please try again.');
      btn.disabled = false; btn.textContent = 'Sign In';
    }
  });
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('service-worker.js').catch(function(){})})}</script>
</body>
</html>
