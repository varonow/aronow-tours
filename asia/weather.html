<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- pwa-head -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#14263F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Asia Adventure">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Asia Adventure — Weather</title>
<link rel="icon" type="image/png" href="images/logo.png">
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>


<header class="itin-header">
  <div class="sec-eyebrow">Live Forecast</div>
  <h1>The <em>Weather</em></h1>
  <div class="sub">Seoul · Bangkok · Phuket — AccuWeather forecast, refreshed through the day</div>
</header>
<div class="info-wrap" style="max-width:960px">
  <div id="weatherContent"><div class="wx-loading"><div class="wx-spin"></div> Checking the skies…</div></div>
</div>
<footer><div class="f-script">one unforgettable trip</div>
  ASIA ADVENTURE &nbsp;&middot;&nbsp; SEOUL &middot; BANGKOK &middot; PHUKET &nbsp;&middot;&nbsp; DEC 2026</footer>

<script type="module">
  import { requireAuth, getCurrentUser, signOut, db } from './js/supabase.js';
  import { renderNav } from './js/nav.js?v=3';

  await requireAuth();
  renderNav('weather.html');


const LOCS = {
  seoul:   { lat:37.5665, lng:126.9780, tz:'Asia/Seoul',   label:'Seoul',   sub:'Gwanghwamun',        icon:'\u2744\uFE0F' },
  bangkok: { lat:13.7563, lng:100.5018, tz:'Asia/Bangkok', label:'Bangkok', sub:'On the Chao Phraya', icon:'\u2600\uFE0F' },
  phuket:  { lat:8.0060,  lng:98.2760,  tz:'Asia/Bangkok', label:'Phuket',  sub:'Trisara \u00b7 Layan', icon:'\uD83C\uDFDD' },
};
const TRIP_DAYS = [
  { date:'2026-12-21', label:'Mon Dec 21', city:'seoul',   activity:'Arrive \u00b7 spa \u00b7 Seoul Sky' },
  { date:'2026-12-22', label:'Tue Dec 22', city:'seoul',   activity:'T.um \u00b7 hanbok \u00b7 shopping' },
  { date:'2026-12-23', label:'Wed Dec 23', city:'seoul',   activity:'Kimchi \u00b7 drumming \u00b7 Samsung' },
  { date:'2026-12-24', label:'Thu Dec 24', city:'bangkok', activity:'Fly to Bangkok \u00b7 Sirocco' },
  { date:'2026-12-25', label:'Fri Dec 25', city:'bangkok', activity:'Wat Arun \u00b7 tuk-tuks \u00b7 Chinatown' },
  { date:'2026-12-26', label:'Sat Dec 26', city:'bangkok', activity:'Chatuchak \u00b7 canals \u00b7 river night' },
  { date:'2026-12-27', label:'Sun Dec 27', city:'phuket',  activity:'Fly to Phuket \u00b7 arrive Trisara' },
  { date:'2026-12-28', label:'Mon Dec 28', city:'phuket',  activity:'Phang Nga Bay boat day \u26F5' },
  { date:'2026-12-29', label:'Tue Dec 29', city:'phuket',  activity:'Elephants \u00b7 Three Monkeys' },
  { date:'2026-12-30', label:'Wed Dec 30', city:'phuket',  activity:'Racha catamaran \u00b7 Catch \u26F5' },
  { date:'2026-12-31', label:'Thu Dec 31 \uD83C\uDF86', city:'phuket', activity:'Fishing \u00b7 NYE Gala on The Deck' },
  { date:'2027-01-01', label:'Fri Jan 1',  city:'phuket',  activity:'Phi Phi \u00b7 Monkey Island \u26F5' },
  { date:'2027-01-02', label:'Sat Jan 2',  city:'phuket',  activity:'Rest day \u00b7 spa \u00b7 Caf\u00e9 del Mar' },
  { date:'2027-01-03', label:'Sun Jan 3',  city:'phuket',  activity:'Last swim \u00b7 fly home' },
];
// Forecast: AccuWeather, through the hub's shared "weather" edge function (key kept server-side, cached).
// The Andaman (waves and sea temperature) still comes from Open-Meteo's free marine model.
function cToF(c){ return Math.round(c*9/5+32); }
const R = n => n == null ? '--' : Math.round(n);
const wIcon = n => n <= 2 ? '☀️' : n <= 4 ? '\u{1F324}️' : n <= 6 ? '⛅' : n <= 8 ? '☁️' : n === 11 ? '\u{1F32B}️' : n === 12 || n === 18 ? '\u{1F327}️' : n <= 14 ? '\u{1F326}️' : n <= 17 ? '⛈️' : n <= 29 ? '❄️' : n === 30 ? '\u{1F975}' : n === 32 ? '\u{1F4A8}' : n <= 34 ? '\u{1F319}' : n <= 38 ? '☁️' : n <= 40 ? '\u{1F326}️' : n <= 42 ? '⛈️' : n <= 44 ? '❄️' : '\u{1F324}️';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function seaDesc(h){ if(h<0.5)return'Glassy — perfect boat day water'; if(h<1.0)return'Slight swell — comfortable'; if(h<1.5)return'Moderate swell'; return'Rough — captain’s call'; }
const aw = L => db.functions.invoke('weather', { body: { lat: L.lat, lng: L.lng } })
  .then(r => { if (r.error || !r.data || r.data.error) throw new Error('weather'); return r.data; });

async function loadWeather(){
  try{
    const [seoul,bangkok,phuket,marine] = await Promise.all([
      aw(LOCS.seoul), aw(LOCS.bangkok), aw(LOCS.phuket),
      fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${LOCS.phuket.lat}&longitude=${LOCS.phuket.lng}&daily=wave_height_max,sea_surface_temperature_max&timezone=Asia%2FBangkok&forecast_days=7`).then(r=>r.json()).catch(()=>null),
    ]);
    render({seoul,bangkok,phuket},marine);
  }catch(e){
    document.getElementById('weatherContent').innerHTML =
      `<div style="text-align:center;padding:40px;color:var(--muted)">
        <div style="font-size:40px;margin-bottom:12px">🌤️</div>
        <p style="font-style:italic">Live forecast unavailable right now — check back soon.</p>
        <p style="font-size:13px;margin-top:8px">Typically in late December: Seoul mid-30s°F and dry · Bangkok upper 80s°F and sunny · Phuket upper 80s°F, sea 84°F.</p>
        <p style="font-size:13px;margin-top:8px"><a href="https://www.accuweather.com" target="_blank" rel="noopener">See the forecast on AccuWeather</a></p>
      </div>`;
  }
}

function cityNow(key,d){
  const L=LOCS[key], c=d.current||{}, t=(d.daily||[])[0]||{};
  return `<div class="wx-city">
    <div class="wx-city-head"><span class="wx-ci">${L.icon}</span>
      <div><div class="wx-cn">${L.label}</div><div class="wx-cs">${L.sub}</div></div>
      <span class="wx-big-ic">${wIcon(c.icon)}</span></div>
    <div class="wx-now">${R(c.tempF)}°<span>F right now</span></div>
    <div class="wx-desc">${esc(c.text)}${c.feelsF!=null?` · feels like ${R(c.feelsF)}°`:''}</div>
    <div class="wx-hl">High ${R(t.hiF)}° · Low ${R(t.loF)}° · 💧 ${t.rain ?? '--'}%</div>
    ${d.link?`<div class="wx-hl"><a href="${esc(d.link)}" target="_blank" rel="noopener">AccuWeather →</a></div>`:''}
  </div>`;
}

function render(data,marine){
  const todayISO = new Date().toISOString().split('T')[0];
  const preTrip = todayISO < '2026-12-20';
  const byDate = {};
  for (const k of Object.keys(data)) byDate[k] = Object.fromEntries((data[k].daily||[]).map(d=>[d.date,d]));

  let html = `<div class="section-title">${preTrip?'Right now, where we’re headed':'Right now'}</div>
    <div class="wx-cities">${cityNow('seoul',data.seoul)}${cityNow('bangkok',data.bangkok)}${cityNow('phuket',data.phuket)}</div>`;

  if(marine && marine.daily){
    const w7=(marine.daily.wave_height_max||[]).slice(0,7).filter(x=>x!=null);
    const s7=(marine.daily.sea_surface_temperature_max||[]).slice(0,7).filter(x=>x!=null);
    const avgW=w7.length?(w7.reduce((a,b)=>a+b,0)/w7.length):null;
    const avgS=s7.length?Math.round(s7.reduce((a,b)=>a+b,0)/s7.length):null;
    html += `<div class="section-title">The Andaman · boat-day water</div>
      <div class="wx-sea">
        <div class="wx-sea-c"><div class="ws-i">🌊</div><div class="ws-v">${avgW!==null?avgW.toFixed(1)+'m':'--'}</div><div class="ws-l">Avg wave height</div><div class="ws-s">${avgW!==null?seaDesc(avgW):''}</div></div>
        <div class="wx-sea-c"><div class="ws-i">🌡️</div><div class="ws-v">${avgS!==null?cToF(avgS)+'°F':'--'}</div><div class="ws-l">Sea temperature</div><div class="ws-s">${avgS!==null&&cToF(avgS)>=80?'Bathwater — stay in all day':'Warm swimming water'}</div></div>
      </div>`;
  }

  html += `<div class="section-title">Trip day by day</div><div class="trip-table">
    <div class="trip-table-header"><div>Day</div><div style="text-align:center">Sky</div><div style="text-align:center">High</div><div style="text-align:center">Low</div><div style="text-align:center">Rain</div></div>
    ${TRIP_DAYS.map(td=>{
      const d=byDate[td.city][td.date];
      const cityTag=`<span class="trip-city">${LOCS[td.city].label}</span>`;
      if(!d) return `<div class="trip-row"><div><div class="trip-row-day">${td.label} ${cityTag}</div><div class="trip-row-activity">${td.activity}</div></div><div class="trip-row-icon">—</div><div class="trip-row-temp" style="color:var(--muted);font-size:12px">Too far out</div><div class="trip-row-low">—</div><div class="trip-row-rain">—</div></div>`;
      return `<div class="trip-row"><div><div class="trip-row-day">${td.label} ${cityTag}</div><div class="trip-row-activity">${td.activity}</div></div><div class="trip-row-icon" title="${esc(d.phrase)}">${wIcon(d.icon)}</div><div class="trip-row-temp">${R(d.hiF)}°F</div><div class="trip-row-low">${R(d.loF)}°F</div><div class="trip-row-rain">${d.rain ?? '--'}%</div></div>`;
    }).join('')}
  </div>
  <p style="font-size:13.5px;color:var(--muted);text-align:center;margin-top:18px">AccuWeather forecast, refreshed through the day. Trip days fill in as they come within about two weeks — until then: Seoul mid-30s°F and dry, Bangkok and Phuket upper 80s°F and sunny.</p>
  <p style="font-size:12.5px;color:var(--muted);text-align:center;margin-top:6px">Forecast by <a href="https://www.accuweather.com" target="_blank" rel="noopener">AccuWeather</a></p>`;

  document.getElementById('weatherContent').innerHTML = html;
}
loadWeather();


</script>
</body>
</html>
