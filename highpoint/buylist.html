<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- pwa-head -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#2B2A28">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="High Point">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>High Point Market — Buy List</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<main>
<header class="page-head"><div class="wrap"><div class="eyebrow">What we are considering</div><h1>Buy List</h1><p class="sub">Snap the piece and its price tag, pick the house and room, and tag it. You both see the same list.</p>
<p style="margin-top:18px"><button class="btn" id="addTop">📸 Add a piece</button></p></div></header>
<section class="band band-paper" style="padding:22px 0"><div class="wrap">
  <div class="filters">
    <select id="fHouse" aria-label="House"></select>
    <select id="fRoom" aria-label="Room"></select>
    <select id="fStatus" aria-label="Tag"></select>
  </div>
  <div class="counts" id="counts"></div>
</div></section>
<section class="band" style="padding-top:8px"><div class="wrap" id="list"><p class="loading">Loading…</p></div></section>
<button class="btn fab" id="addFab" aria-label="Add a piece">📸 Add</button>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-bar"><h2 id="sheetTitle">Add a piece</h2><button class="sheet-x" id="sheetX" aria-label="Close">×</button></div>
  <div class="sheet-in">
    <div class="field"><span class="lab">Photos</span>
      <label class="btn ghost wide" for="file">📷 Take or choose photos</label>
      <input id="file" type="file" accept="image/*" multiple hidden>
      <div class="thumbs" id="thumbs"></div>
      <p class="hint">Include the price tag. You can add more than one.</p></div>
    <div class="field"><label for="house">Which house?</label><select id="house"></select>
      <input id="houseNew" maxlength="60" placeholder="Name of the house" style="margin-top:8px" hidden></div>
    <div class="field"><label for="room">Which room?</label><select id="room"></select>
      <input id="roomNew" maxlength="60" placeholder="Name of the room" style="margin-top:8px" hidden></div>
    <div class="field"><label for="title">What is it?</label><input id="title" maxlength="120" placeholder="For example: alabaster flush mount"></div>
    <div class="field"><label for="vendor">Which showroom?</label><select id="vendor"></select>
      <input id="vendorNew" maxlength="120" placeholder="Showroom name and space number" style="margin-top:8px" hidden></div>
    <div class="field"><label for="price">Price</label><input id="price" maxlength="80" placeholder="From the tag. Note trade or retail."></div>
    <div class="field"><label for="details">Details</label><textarea id="details" maxlength="4000" placeholder="Dimensions, finish or COM, lead time, and what we thought of it"></textarea></div>
    <div class="field"><span class="lab">Tag</span><div class="choices" id="status"></div></div>
    <button class="btn wide" id="save">Save to the Buy List</button>
    <p id="msg" style="margin-top:12px;min-height:30px"></p>
    <p id="delWrap" style="margin-top:26px" hidden><button class="btn ghost small" id="del">Delete this piece</button></p>
  </div>
</div>
<div class="viewer" id="viewer" hidden>
  <div class="viewer-bar"><span id="vCount"></span><button id="vX" aria-label="Close">×</button></div>
  <img id="vImg" alt="">
  <div class="viewer-bar"><button id="vPrev" aria-label="Previous photo">‹</button><button id="vNext" aria-label="Next photo">›</button></div>
</div>
</main>
<script type="module">
import { start, db, esc, today, mapUrl, logistics, FOOTER } from './js/app.js?v=1';
document.querySelector('main').insertAdjacentHTML('afterend', FOOTER);
import { VENDORS } from './js/data.js?v=1';
const ctx = await start('buylist.html');
if (ctx) {
const $ = id => document.getElementById(id);
const BUCKET = 'highpoint-photos';
const STATUS = [['loved', '❤️', 'Loved it'], ['maybe', '🤔', 'Maybe'], ['passed', '✖️', 'Passed'], ['ordered', '✅', 'Ordered']];
const stName = Object.fromEntries(STATUS.map(s => [s[0], s[1] + ' ' + s[2]]));
const ROOMS = ['Entry', 'Living room', 'Dining room', 'Kitchen', 'Library', 'Hallway', 'Stairs', 'Primary bedroom', 'Primary bath', "Girls' room", "Kids' floor", 'Guest room', 'Powder room', 'Cellar', 'Backyard'];
const OTHER = '__other__';

let houses = [], rooms = [], items = [], urls = {};
let editing = null, photos = [], status = 'maybe', busy = false;
const last = { house: null, room: null, vendor: '' };

const opt = (v, t, sel) => `<option value="${esc(v)}" ${sel ? 'selected' : ''}>${esc(t ?? v)}</option>`;
const roomsFor = h => [...new Set([...ROOMS, ...rooms.filter(r => r.house === h).map(r => r.name)])];

async function load() {
  const [h, r, i] = await Promise.all([
    db.from('highpoint_houses').select('*').order('sort').order('id'),
    db.from('highpoint_rooms').select('*').order('sort').order('id'),
    db.from('highpoint_items').select('*').order('created_at', { ascending: false }),
  ]);
  if (i.error) { $('list').innerHTML = '<p class="err">Could not load the Buy List. Please refresh.</p>'; return; }
  houses = (h.data || []).map(x => x.name); rooms = r.data || []; items = i.data || [];
  const need = [...new Set(items.flatMap(x => x.photos || []))].filter(p => !urls[p]);
  if (need.length) {
    const { data } = await db.storage.from(BUCKET).createSignedUrls(need, 60 * 60 * 6);
    (data || []).forEach((s, k) => { if (s && s.signedUrl) urls[need[k]] = s.signedUrl; });
  }
  drawFilters(); draw();
}

function drawFilters() {
  const fh = $('fHouse').value, fr = $('fRoom').value, fs = $('fStatus').value;
  const hs = [...new Set([...houses, ...items.map(x => x.house)])];
  $('fHouse').innerHTML = opt('', 'All houses') + hs.map(x => opt(x, x, x === fh)).join('');
  const rs = [...new Set(items.filter(x => !$('fHouse').value || x.house === $('fHouse').value).map(x => x.room).filter(Boolean))];
  $('fRoom').innerHTML = opt('', 'All rooms') + rs.map(x => opt(x, x, x === fr)).join('');
  $('fStatus').innerHTML = opt('', 'All tags') + STATUS.map(s => opt(s[0], s[1] + ' ' + s[2], s[0] === fs)).join('');
}

function card(x) {
  const ph = x.photos || [];
  const img = ph.length && urls[ph[0]] ? `<img src="${esc(urls[ph[0]])}" alt="${esc(x.title || 'Photo')}" loading="lazy">` : '<span class="none">No photo yet</span>';
  return `<div class="item ${x.status}">
    <button class="item-ph" data-view="${x.id}" ${ph.length ? '' : 'disabled'}>${img}${ph.length > 1 ? `<span class="n">${ph.length} photos</span>` : ''}</button>
    <div class="item-b">
      <div class="item-st st-${x.status}">${stName[x.status]}</div>
      <h3>${esc(x.title || 'Untitled piece')}</h3>
      ${x.vendor ? `<div class="item-v">${esc(x.vendor)}</div>` : ''}
      ${x.price ? `<div class="item-v">${esc(x.price)}</div>` : ''}
      ${x.details ? `<div class="item-d">${esc(x.details)}</div>` : ''}
      <div class="item-by">Added by ${esc(x.added_by || 'us')}</div>
      <div class="item-act"><button class="btn ghost small" data-edit="${x.id}">Edit</button></div>
    </div></div>`;
}

function draw() {
  const fh = $('fHouse').value, fr = $('fRoom').value, fs = $('fStatus').value;
  const shown = items.filter(x => (!fh || x.house === fh) && (!fr || x.room === fr) && (!fs || x.status === fs));
  const n = k => shown.filter(x => x.status === k).length;
  $('counts').textContent = items.length ? `${shown.length} ${shown.length === 1 ? 'piece' : 'pieces'} · ${n('loved')} loved · ${n('maybe')} maybe · ${n('passed')} passed · ${n('ordered')} ordered` : '';
  if (!items.length) { $('list').innerHTML = '<p class="muted" style="text-align:center;padding:40px 0">Nothing here yet. Tap “Add a piece” when something catches your eye.</p>'; return; }
  if (!shown.length) { $('list').innerHTML = '<p class="muted" style="text-align:center;padding:40px 0">Nothing matches those filters.</p>'; return; }
  const hs = [...new Set([...houses, ...shown.map(x => x.house)])].filter(h => shown.some(x => x.house === h));
  $('list').innerHTML = hs.map(h => {
    const mine = shown.filter(x => x.house === h);
    const rs = [...new Set([...roomsFor(h), ...mine.map(x => x.room || '')])].filter(r => mine.some(x => (x.room || '') === r));
    return `<div class="grp"><h2>${esc(h)}</h2>` + rs.map(r => `<h3>${esc(r || 'No room chosen')}</h3><div class="items">${mine.filter(x => (x.room || '') === r).map(card).join('')}</div>`).join('') + '</div>';
  }).join('');
}

/* ---------- add / edit sheet ---------- */
function fillHouse(sel) {
  $('house').innerHTML = houses.map(h => opt(h, h, h === sel)).join('') + opt(OTHER, 'Another house…');
  $('houseNew').hidden = $('house').value !== OTHER;
}
function fillRoom(sel) {
  const h = $('house').value;
  const list = h === OTHER ? ROOMS : roomsFor(h);
  $('room').innerHTML = opt('', 'Choose a room') + list.map(r => opt(r, r, r === sel)).join('') + opt(OTHER, 'Another room…');
  $('roomNew').hidden = $('room').value !== OTHER;
}
function fillVendor(sel) {
  const names = VENDORS.map(v => v.name);
  const known = !sel || names.includes(sel);
  $('vendor').innerHTML = opt('', 'Choose a showroom') + VENDORS.map(v => opt(v.name, `${v.name} (${v.day}, ${v.where})`, v.name === sel)).join('') + opt(OTHER, 'Another showroom…', !known);
  $('vendorNew').hidden = known; $('vendorNew').value = known ? '' : sel;
}
function fillStatus() {
  $('status').innerHTML = STATUS.map(s => `<button type="button" class="choice ${s[0] === status ? 'on' : ''}" data-s="${s[0]}"><span style="font-size:24px">${s[1]}</span>${s[2]}</button>`).join('');
}
function drawThumbs() {
  $('thumbs').innerHTML = photos.map((p, i) => `<div class="thumb"><img src="${esc(p.url)}" alt="Photo ${i + 1}"><button type="button" data-rm="${i}" aria-label="Remove photo">×</button></div>`).join('');
}
function openSheet(x, vendor) {
  editing = x || null;
  $('sheetTitle').textContent = x ? 'Edit this piece' : 'Add a piece';
  $('save').textContent = x ? 'Save changes' : 'Save to the Buy List';
  $('delWrap').hidden = !x; $('del').textContent = 'Delete this piece'; $('del').dataset.sure = '';
  photos = x ? (x.photos || []).map(p => ({ path: p, url: urls[p] || '' })) : [];
  status = x ? x.status : 'maybe';
  fillHouse(x ? x.house : (last.house || houses[0])); $('houseNew').value = '';
  fillRoom(x ? x.room : last.room); $('roomNew').value = '';
  fillVendor(x ? x.vendor : (vendor || last.vendor));
  $('title').value = x ? x.title || '' : ''; $('price').value = x ? x.price || '' : ''; $('details').value = x ? x.details || '' : '';
  fillStatus(); drawThumbs(); $('msg').textContent = ''; $('msg').className = '';
  $('sheet').hidden = false; $('sheet').scrollTop = 0; document.body.style.overflow = 'hidden';
}
function closeSheet() {
  photos.forEach(p => { if (p.blob) URL.revokeObjectURL(p.url); });
  $('sheet').hidden = true; document.body.style.overflow = ''; $('file').value = '';
}

// Shrink phone photos before sending, so they upload quickly on showroom wifi.
async function shrink(file) {
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const k = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
    if (blob) return { blob, ext: 'jpg', type: 'image/jpeg' };
  } catch (e) {}
  return { blob: file, ext: (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg', type: file.type || 'image/jpeg' };
}
$('file').addEventListener('change', async e => {
  for (const f of [...e.target.files]) {
    const s = await shrink(f);
    photos.push({ ...s, url: URL.createObjectURL(s.blob) });
  }
  e.target.value = ''; drawThumbs();
});
$('thumbs').addEventListener('click', e => { const b = e.target.closest('[data-rm]'); if (!b) return; photos.splice(+b.dataset.rm, 1); drawThumbs(); });
$('house').addEventListener('change', () => { $('houseNew').hidden = $('house').value !== OTHER; fillRoom(''); if (!$('houseNew').hidden) $('houseNew').focus(); });
$('room').addEventListener('change', () => { $('roomNew').hidden = $('room').value !== OTHER; if (!$('roomNew').hidden) $('roomNew').focus(); });
$('vendor').addEventListener('change', () => { $('vendorNew').hidden = $('vendor').value !== OTHER; if (!$('vendorNew').hidden) $('vendorNew').focus(); });
$('status').addEventListener('click', e => { const b = e.target.closest('.choice'); if (!b) return; status = b.dataset.s; fillStatus(); });

const fail = t => { $('msg').className = 'err'; $('msg').textContent = t; busy = false; $('save').disabled = false; };
$('save').addEventListener('click', async () => {
  if (busy) return;
  let house = $('house').value, room = $('room').value, vendor = $('vendor').value;
  if (house === OTHER) house = $('houseNew').value.trim();
  if (room === OTHER) room = $('roomNew').value.trim();
  if (vendor === OTHER) vendor = $('vendorNew').value.trim();
  if (!house) return fail('Please choose or name the house.');
  if (!photos.length && !$('title').value.trim()) return fail('Add a photo, or say what it is.');
  busy = true; $('save').disabled = true; $('msg').className = ''; $('msg').textContent = 'Saving…';

  if (!houses.some(h => h.toLowerCase() === house.toLowerCase())) {
    const { error } = await db.from('highpoint_houses').insert({ name: house, sort: 100 });
    if (error && error.code !== '23505') return fail('The new house did not save. Please try again.');
  } else house = houses.find(h => h.toLowerCase() === house.toLowerCase());
  if (room && !roomsFor(house).some(r => r.toLowerCase() === room.toLowerCase())) {
    const { error } = await db.from('highpoint_rooms').insert({ house, name: room, sort: 500 });
    if (error && error.code !== '23505') return fail('The new room did not save. Please try again.');
  } else if (room) room = roomsFor(house).find(r => r.toLowerCase() === room.toLowerCase());

  const paths = [];
  for (let i = 0; i < photos.length; i++) {
    const p = photos[i];
    if (p.path) { paths.push(p.path); continue; }
    $('msg').textContent = `Sending photo ${i + 1} of ${photos.length}…`;
    const path = `${Date.now()}-${Math.random().toString(36).slice(2, 10)}.${p.ext}`;
    const { error } = await db.storage.from(BUCKET).upload(path, p.blob, { contentType: p.type });
    if (error) return fail('A photo did not send. Check your signal and tap Save again.');
    p.path = path; paths.push(path);
  }
  const row = { house, room: room || null, vendor: vendor || null, title: $('title').value.trim() || null, price: $('price').value.trim() || null,
    details: $('details').value.trim() || null, status, photos: paths, updated_at: new Date().toISOString() };
  let error;
  if (editing) {
    const gone = (editing.photos || []).filter(p => !paths.includes(p));
    ({ error } = await db.from('highpoint_items').update(row).eq('id', editing.id));
    if (!error && gone.length) await db.storage.from(BUCKET).remove(gone);
  } else {
    ({ error } = await db.from('highpoint_items').insert({ ...row, added_by: ctx.name }));
  }
  if (error) return fail('That did not save. Please try again.');
  last.house = house; last.room = room; last.vendor = vendor;
  busy = false; $('save').disabled = false;
  closeSheet(); await load();
});
$('del').addEventListener('click', async () => {
  if (!editing) return;
  if (!$('del').dataset.sure) { $('del').dataset.sure = '1'; $('del').textContent = 'Tap again to delete for good'; return; }
  $('del').disabled = true;
  const { error } = await db.from('highpoint_items').delete().eq('id', editing.id);
  $('del').disabled = false;
  if (error) return fail('That did not delete. Please try again.');
  if ((editing.photos || []).length) await db.storage.from(BUCKET).remove(editing.photos);
  closeSheet(); await load();
});

/* ---------- photo viewer ---------- */
let vList = [], vAt = 0;
function showV() { $('vImg').src = urls[vList[vAt]] || ''; $('vCount').textContent = `Photo ${vAt + 1} of ${vList.length}`; $('vPrev').style.visibility = $('vNext').style.visibility = vList.length > 1 ? '' : 'hidden'; }
$('vX').addEventListener('click', () => { $('viewer').hidden = true; });
$('vPrev').addEventListener('click', () => { vAt = (vAt + vList.length - 1) % vList.length; showV(); });
$('vNext').addEventListener('click', () => { vAt = (vAt + 1) % vList.length; showV(); });

$('list').addEventListener('click', e => {
  const ed = e.target.closest('[data-edit]'), vw = e.target.closest('[data-view]');
  if (ed) openSheet(items.find(x => x.id == ed.dataset.edit));
  else if (vw) { const x = items.find(i => i.id == vw.dataset.view); if (x && x.photos.length) { vList = x.photos; vAt = 0; showV(); $('viewer').hidden = false; } }
});
$('addTop').addEventListener('click', () => openSheet());
$('addFab').addEventListener('click', () => openSheet());
$('sheetX').addEventListener('click', closeSheet);
$('fHouse').addEventListener('change', () => { $('fRoom').value = ''; drawFilters(); draw(); });
$('fRoom').addEventListener('change', draw);
$('fStatus').addEventListener('change', draw);

await load();
const add = new URLSearchParams(location.search).get('add');
if (add !== null) { openSheet(null, add); history.replaceState(null, '', 'buylist.html'); }
}
</script>
</body>
</html>
