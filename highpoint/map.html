<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- pwa-head -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#2B2A28">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="High Point">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>High Point Market — Map</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<main>
<header class="page-head"><div class="wrap"><div class="eyebrow">Where each building is</div><h1>Map</h1><p class="sub">Numbers follow the order of the day. Tap a stop in the list to find it on the map.</p></div></header>
<div class="tabs" id="tabs"></div>
<section class="band" style="padding-top:22px"><div class="wrap">
  <div id="map"></div>
  <p style="margin-top:16px"><a class="btn ghost small" id="route" target="_blank" rel="noopener">🚗 Open the whole day as a route in Google Maps</a></p>
  <div id="legend" style="margin-top:18px"></div>
  <p class="muted" style="margin-top:16px" id="approx"></p>
</div></section>
</main>
<script type="module">
import { start, db, esc, today, mapUrl, logistics, FOOTER } from './js/app.js?v=1';
document.querySelector('main').insertAdjacentHTML('afterend', FOOTER);
import { DAYS } from './js/data.js?v=1';
const ctx = await start('map.html');
if (ctx) {
const $ = id => document.getElementById(id);
const HOTEL = { name: 'O.Henry Hotel', addr: '624 Green Valley Rd, Greensboro, NC' };
let cur = Math.max(0, DAYS.findIndex(d => d.iso === today()));
const want = new URLSearchParams(location.search).get('day');
if (want && DAYS.some(d => d.iso === want)) cur = DAYS.findIndex(d => d.iso === want);

const map = L.map('map', { scrollWheelZoom: false });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
let layer = L.layerGroup().addTo(map), marks = [];

function points(d) {
  const out = [];
  d.stops.forEach(s => {
    if (s.pin) out.push({ name: s.name, sub: s.time + ' · ' + s.vendors.length + (s.vendors.length === 1 ? ' showroom' : ' showrooms'), addr: s.addr, pin: s.pin, car: s.car });
    else s.vendors.forEach(v => out.push({ name: v.name, sub: s.time + ' · ' + v.space, addr: v.addr, pin: v.pin, car: s.car, approx: v.approx }));
  });
  return out;
}
function draw() {
  const d = DAYS[cur], pts = points(d);
  $('tabs').innerHTML = DAYS.map((x, i) => `<button class="tab ${i === cur ? 'on' : ''}" data-i="${i}">${x.tab}<b>${x.num}</b></button>`).join('');
  layer.clearLayers(); marks = [];
  pts.forEach((p, i) => {
    const m = L.marker(p.pin, { icon: L.divIcon({ className: '', html: `<div class="pin ${p.car ? 'car' : ''}">${i + 1}</div>`, iconSize: [32, 32], iconAnchor: [16, 16] }) })
      .bindPopup(`<b>${esc(p.name)}</b><br>${esc(p.sub)}<br><a href="${mapUrl(p.name + ', ' + p.addr)}" target="_blank" rel="noopener">Open in Maps</a>`).addTo(layer);
    marks.push(m);
  });
  map.fitBounds(L.latLngBounds(pts.map(p => p.pin)).pad(0.15));
  $('legend').innerHTML = pts.map((p, i) => `<button class="leg ${p.car ? 'car' : ''}" data-i="${i}"><b>${i + 1}</b><span>${esc(p.name)}${p.approx ? ' *' : ''}<small>${p.car ? '🚗 ' : ''}${esc(p.sub)}</small></span></button>`).join('') +
    `<a class="leg" style="text-decoration:none" href="${mapUrl(HOTEL.name + ', ' + HOTEL.addr)}" target="_blank" rel="noopener"><b>🏨</b><span>${HOTEL.name}<small>In Greensboro. Tap for directions.</small></span></a>`;
  $('approx').textContent = pts.some(p => p.approx) ? '* The pin is on the right street but may be a few doors off. The address link is exact.' : '';
  $('route').href = 'https://www.google.com/maps/dir/' + pts.map(p => encodeURIComponent(p.addr)).join('/');
}
$('tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (!b) return; cur = +b.dataset.i; draw(); });
$('legend').addEventListener('click', e => { const b = e.target.closest('button.leg'); if (!b) return; const m = marks[+b.dataset.i]; map.setView(m.getLatLng(), 17); m.openPopup(); $('map').scrollIntoView({ behavior: 'smooth', block: 'center' }); });
draw();
}
</script>
</body>
</html>
